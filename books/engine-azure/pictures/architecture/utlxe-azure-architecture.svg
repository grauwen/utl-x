<rect width="1560" height="975" fill="#FAFAF8"/>
<text x="30" y="36" font-family="Helvetica,Arial" font-size="19" fill="#111" font-weight="bold" text-anchor="start">UTLXe on Azure — Marketplace managed application, as shipped in 1.4.4</text>
<text x="30" y="57" font-family="Helvetica,Arial" font-size="12" fill="#555" font-weight="normal" text-anchor="start">Solid = works today   ·   Amber dashed = exists but not reachable   ·   Red dotted = absent, proposed in EF25</text>
<rect x="30" y="86" width="320" height="112" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.6" />
<text x="42" y="108" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Caller</text>
<text x="42" y="125" font-family="Helvetica,Arial" font-size="11.5" fill="#666">browser, or any application</text>
<text x="42" y="146" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">X-Admin-Key  → admin API + Web UI</text>
<text x="42" y="165" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">X-Api-Key    → data path only</text>
<text x="42" y="184" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#777" font-weight="normal" text-anchor="start">(no key)     → /health, /metrics</text>
<rect x="30" y="222" width="1130" height="690" rx="7" fill="#F4F7FB" stroke="#333333" stroke-width="1.6" />
<text x="42" y="244" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Azure subscription</text>
<text x="42" y="261" font-family="Helvetica,Arial" font-size="11.5" fill="#666">the customer's</text>
<rect x="50" y="272" width="1090" height="418" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="62" y="294" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Managed resource group — created and owned by the managed application</text>
<text x="62" y="311" font-family="Helvetica,Arial" font-size="11.5" fill="#666">the deployment principal has Owner here, and NOWHERE else</text>
<rect x="70" y="334" width="1050" height="338" rx="7" fill="#F7F9F4" stroke="#333333" stroke-width="1.6" />
<text x="82" y="356" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Managed Environment  (Consumption profile, no workload profiles)</text>
<text x="82" y="373" font-family="Helvetica,Arial" font-size="11.5" fill="#666">QUOTA: 1 per region on this subscription · caps a replica at 4 vCPU / 8 GiB</text>
<rect x="90" y="398" width="660" height="286" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="102" y="420" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Container App</text>
<text x="102" y="437" font-family="Helvetica,Arial" font-size="11.5" fill="#666">ONE ingress · external · targetPort 8088 · transport http</text>
<text x="102" y="458" font-family="Menlo,Consolas,monospace" font-size="11" fill="#B8860B" font-weight="normal" text-anchor="start">maxReplicas pinned to 1 (1.4.4) · minReplicas 0–1</text>
<rect x="104" y="470" width="632" height="172" rx="7" fill="#FBFBF7" stroke="#333333" stroke-width="1.6" />
<text x="116" y="487" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#333333">Replica</text>
<text x="116" y="504" font-family="Helvetica,Arial" font-size="11.5" fill="#666">containers share one network namespace → 127.0.0.1</text>
<rect x="116" y="512" width="196" height="118" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="128" y="527" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">utlxe-ui</text>
<text x="128" y="544" font-family="Helvetica,Arial" font-size="11.5" fill="#666">nginx · 0.25 vCPU</text>
<text x="126" y="560" font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#1565C0" font-weight="bold" text-anchor="start">:8088  PUBLISHED</text>
<text x="126" y="575" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">/             static</text>
<text x="126" y="588" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">/admin/     → 8081</text>
<text x="126" y="601" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">/health     → 8081</text>
<text x="126" y="614" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">/metrics    → 8081</text>
<text x="126" y="627" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">…/{id}/run  → 8085</text>
<rect x="326" y="512" width="212" height="118" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="338" y="527" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">utlxe</text>
<text x="338" y="544" font-family="Helvetica,Arial" font-size="11.5" fill="#666">temurin:21-jre · JVM</text>
<text x="336" y="560" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">:8081 admin+health+metrics</text>
<text x="336" y="575" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">:8085 data plane</text>
<text x="336" y="590" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#B8860B" font-weight="normal" text-anchor="start">:9090 gRPC — NOT STARTED</text>
<text x="336" y="607" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#666" font-weight="normal" text-anchor="start">registry: in-memory</text>
<text x="336" y="621" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#666" font-weight="normal" text-anchor="start">UTLXE_ADMIN_KEY (secret)</text>
<rect x="552" y="512" width="172" height="118" rx="7" fill="#FFFDF5" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="7,5" />
<text x="564" y="527" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#B8860B">daprd</text>
<text x="564" y="544" font-family="Helvetica,Arial" font-size="11.5" fill="#666">INJECTED</text>
<text x="562" y="560" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#B8860B" font-weight="normal" text-anchor="start">only when mode</text>
<text x="562" y="573" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#B8860B" font-weight="normal" text-anchor="start">= servicebus</text>
<text x="562" y="590" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">:3500 sidecar</text>
<text x="562" y="604" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#333" font-weight="normal" text-anchor="start">appPort 8085</text>
<text x="562" y="621" font-family="Menlo,Consolas,monospace" font-size="9.6" fill="#666" font-weight="normal" text-anchor="start">one per REPLICA</text>
