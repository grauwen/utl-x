<text x="778" y="416" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#333333">Dapr components</text>
<text x="778" y="433" font-family="Helvetica,Arial" font-size="11.5" fill="#666">ARM resources, ENVIRONMENT-scoped</text>
<text x="778" y="452" font-family="Menlo,Consolas,monospace" font-size="10" fill="#666" font-weight="normal" text-anchor="start">created at deploy time — the engine</text>
<text x="778" y="465" font-family="Menlo,Consolas,monospace" font-size="10" fill="#666" font-weight="normal" text-anchor="start">cannot create one at runtime</text>
