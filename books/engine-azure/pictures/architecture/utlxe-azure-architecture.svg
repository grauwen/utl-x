<rect x="778" y="640" width="314" height="24" rx="7" fill="#FFF8E1" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="7,5" />
<text x="790" y="656" font-family="Helvetica,Arial" font-size="10.5" font-weight="bold" fill="#B8860B">utlxe-servicebus — NOT CREATED</text>
<rect x="70" y="700" width="320" height="62" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="82" y="718" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">Azure Files  utlxe-data</text>
<text x="82" y="735" font-family="Helvetica,Arial" font-size="11.5" fill="#666">100 GiB · /utlxe/data · read ONCE at startup</text>
<rect x="404" y="700" width="300" height="62" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="416" y="718" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">Log Analytics workspace</text>
<text x="416" y="735" font-family="Helvetica,Arial" font-size="11.5" fill="#666">appLogsConfiguration · 30 days</text>
<rect x="718" y="700" width="402" height="62" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="730" y="718" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">Container App secrets</text>
<text x="730" y="735" font-family="Helvetica,Arial" font-size="11.5" fill="#666">admin-key · data-plane-key · servicebus-connection</text>
<path d="M 420 642 L 420 700" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#a333)"/>
<text x="428" y="676" font-family="Menlo,Consolas,monospace" font-size="10" fill="#666" font-weight="normal" text-anchor="start">/utlxe/data</text>
<rect x="50" y="790" width="1090" height="108" rx="7" fill="#F9F4F4" stroke="#333333" stroke-width="1.6" />
<text x="62" y="812" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">The customer's OWN resources — outside the managed resource group</text>
<text x="62" y="829" font-family="Helvetica,Arial" font-size="11.5" fill="#666">the managed app cannot create role assignments here (confirmed)</text>
<rect x="70" y="830" width="240" height="54" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="82" y="847" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">Service Bus namespace</text>
<text x="82" y="864" font-family="Helvetica,Arial" font-size="11.5" fill="#666">queue in · topic out</text>
<rect x="326" y="830" width="196" height="54" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" />
<text x="338" y="847" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#333333">Event Hub</text>
<text x="338" y="864" font-family="Helvetica,Arial" font-size="11.5" fill="#666">output only in 1.4.4</text>
<rect x="538" y="830" width="264" height="54" rx="7" fill="#FFF5F5" stroke="#B00020" stroke-width="1.6" stroke-dasharray="2,4" />
<text x="550" y="847" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#B00020">Azure Key Vault</text>
<text x="550" y="864" font-family="Helvetica,Arial" font-size="11.5" fill="#666">ABSENT — EF25 Part 2</text>
<rect x="818" y="830" width="302" height="54" rx="7" fill="#FFF5F5" stroke="#B00020" stroke-width="1.6" stroke-dasharray="2,4" />
<text x="830" y="847" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#B00020">User-assigned managed identity</text>
<text x="830" y="864" font-family="Helvetica,Arial" font-size="11.5" fill="#666">ABSENT — EF25 Part 1</text>
<path d="M 1104 518 L 1150 518 L 1150 898 L 190 898 L 190 884" fill="none" stroke="#B8860B" stroke-width="1.8" marker-end="url(#aB8860B)"/>
<path d="M 1104 614 L 1142 614 L 1142 892 L 424 892 L 424 884" fill="none" stroke="#B8860B" stroke-width="1.8" marker-end="url(#aB8860B)"/>
<text x="778" y="478" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">credentials: a connection string,</text>
<text x="778" y="491" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">from a Container App secret</text>
<path d="M 190 198 L 190 214 L 620 214 L 620 470" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#a1565C0)"/>
<text x="630" y="330" font-family="Menlo,Consolas,monospace" font-size="11" fill="#1565C0" font-weight="normal" text-anchor="start">HTTPS  ingress → :8088</text>
<rect x="1190" y="222" width="340" height="118" rx="7" fill="#FFFDF5" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="7,5" />
<text x="1202" y="244" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#B8860B">Application Insights</text>
<text x="1202" y="261" font-family="Helvetica,Arial" font-size="11.5" fill="#666">agent baked into the engine image</text>
<text x="1202" y="282" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">-javaagent is added ONLY when</text>
<text x="1202" y="296" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">APPLICATIONINSIGHTS_CONNECTION_</text>
<text x="1202" y="310" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">STRING is set. No wizard field for</text>
<text x="1202" y="324" font-family="Menlo,Consolas,monospace" font-size="10" fill="#B8860B" font-weight="normal" text-anchor="start">it, so unused by default.</text>
<rect x="1190" y="362" width="340" height="500" rx="7" fill="#FFF8F8" stroke="#333333" stroke-width="1.6" />
<text x="1202" y="384" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#333333">Known gaps</text>
<text x="1202" y="401" font-family="Helvetica,Arial" font-size="11.5" fill="#666">what this picture does not do</text>
<text x="1202" y="420" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B00020" font-weight="normal" text-anchor="start">utlxe:1.4.4 and utlxe-ui:1.4.4 do</text>
<text x="1202" y="435.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B00020" font-weight="normal" text-anchor="start">not exist on ghcr — every 1.4.4</text>
<text x="1202" y="451.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B00020" font-weight="normal" text-anchor="start">deployment fails on image pull.</text>
<text x="1202" y="482.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">Service Bus path NEVER tested:</text>
<text x="1202" y="497.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">0 assertions, enableDapr never</text>
<text x="1202" y="513.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">true in any test deployment.</text>
<text x="1202" y="544.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">A queue message routes to the</text>
<text x="1202" y="559.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">transformation NAMED after the</text>
<text x="1202" y="575.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">component — 'servicebus-input'.</text>
<text x="1202" y="590.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">One queue per deployment.</text>
<text x="1202" y="621.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">utlxe-servicebus pub/sub is hard-</text>
<text x="1202" y="637.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">coded in the engine (5x) and</text>
<text x="1202" y="652.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">created nowhere → path is dead.</text>
<text x="1202" y="683.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">:9090 gRPC not started; one</text>
<text x="1202" y="699.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">ingress cannot publish it beside</text>
<text x="1202" y="714.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B8860B" font-weight="normal" text-anchor="start">HTTP. Needs a second app.</text>
<text x="1202" y="745.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B00020" font-weight="normal" text-anchor="start">No Key Vault, no managed identity.</text>
<text x="1202" y="761.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#B00020" font-weight="normal" text-anchor="start">Secrets are plaintext in the wizard.</text>
<text x="1202" y="792.0" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#666" font-weight="normal" text-anchor="start">Event Hubs INPUT needs a check-</text>
<text x="1202" y="807.5" font-family="Menlo,Consolas,monospace" font-size="10.2" fill="#666" font-weight="normal" text-anchor="start">point store + its own KEDA trigger.</text>
<text x="30" y="949" font-family="Menlo,Consolas,monospace" font-size="11" fill="#555" font-weight="normal" text-anchor="start">Ports: 8088 nginx (the only published one) · 8081 engine admin/health/metrics · 8085 engine data plane · 9090 gRPC (off) · 3500 daprd</text>
<text x="30" y="965" font-family="Helvetica,Arial" font-size="10" fill="#888" font-weight="normal" text-anchor="start">Generated 2026-11-20 from mainTemplate.json, createUiDefinition.json, nginx.conf, Dockerfile.engine and the engine sources.</text>
