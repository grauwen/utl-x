<text x="790" y="512" font-family="Helvetica,Arial" font-size="11" font-weight="bold" fill="#333333">servicebus-input</text>
<text x="790" y="529" font-family="Helvetica,Arial" font-size="11.5" fill="#666">bindings.azure.servicebus.queues</text>
