<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CC0000"/>
    </marker>
  </defs>

  <!-- top label -->
  <text x="175" y="26" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">untrusted bytes</text>
  <line x1="175" y1="32" x2="175" y2="44" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- stage boxes (cx=175, x=40 w=270, h=42, pitch=62) -->
  <!-- 1 protocol break -->
  <rect x="40" y="46" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="72" font-size="12" text-anchor="middle" fill="#333333">protocol break</text>
  <text x="325" y="72" font-size="10.5" fill="#777777">gateway / diode side</text>
  <line x1="175" y1="88" x2="175" y2="108" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 parser -->
  <rect x="40" y="108" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="134" font-size="12" text-anchor="middle" fill="#333333">hardened, sandboxed parser</text>
  <text x="325" y="128" font-size="10.5" fill="#777777">attack surface #1</text>
  <text x="325" y="142" font-size="10.5" fill="#CC0000">fail-closed</text>
  <line x1="175" y1="150" x2="175" y2="170" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 UDM pivot -->
  <rect x="40" y="170" width="270" height="42" rx="6" fill="#eaf3fb" stroke="#0078D4" stroke-width="1.8"/>
  <text x="175" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#0078D4">UDM (canonical)</text>
  <text x="325" y="196" font-size="10.5" fill="#777777">the one model — rules run here</text>
  <line x1="175" y1="212" x2="175" y2="232" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 structural caps -->
  <rect x="40" y="232" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="258" font-size="12" text-anchor="middle" fill="#333333">structural caps</text>
  <text x="325" y="258" font-size="10.5" fill="#777777">anti-bomb (depth / size / count)</text>
  <line x1="175" y1="274" x2="175" y2="294" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 schema allow-list -->
  <rect x="40" y="294" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="320" font-size="12" text-anchor="middle" fill="#333333">schema allow-list</text>
  <text x="325" y="320" font-size="10.5" fill="#777777">must match an approved contract</text>
  <line x1="175" y1="336" x2="175" y2="356" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 label guard -->
  <rect x="40" y="356" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="382" font-size="12" text-anchor="middle" fill="#333333">label guard</text>
  <text x="325" y="376" font-size="10.5" fill="#777777">STANAG 4774 / 4778</text>
  <text x="325" y="390" font-size="10.5" fill="#777777">present · bound · releasable</text>
  <line x1="175" y1="398" x2="175" y2="418" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 7 content rules -->
  <rect x="40" y="418" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="444" font-size="12" text-anchor="middle" fill="#333333">content rules — validate.*</text>
  <text x="325" y="444" font-size="10.5" fill="#777777">ranges · field allow-list · keywords</text>
  <line x1="175" y1="460" x2="175" y2="480" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 8 canonical re-serialize -->
  <rect x="40" y="480" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="500" font-size="12" text-anchor="middle" fill="#333333">canonical low-fidelity</text>
  <text x="175" y="515" font-size="12" text-anchor="middle" fill="#333333">re-serialize</text>
  <text x="325" y="504" font-size="10.5" fill="#777777">disarm · anti-smuggling</text>
  <line x1="175" y1="522" x2="175" y2="542" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 9 optional hardware verifier -->
  <rect x="40" y="542" width="270" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="175" y="568" font-size="12" text-anchor="middle" fill="#333333">optional hardware verifier</text>
  <text x="325" y="568" font-size="10.5" fill="#777777">transform &#8594; verify (Ch 8)</text>

  <!-- PASS egress -->
  <line x1="175" y1="584" x2="175" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <text x="175" y="640" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">verified egress</text>

  <!-- FAIL branch -->
  <path d="M310,200 L500,200 L500,560" fill="none" stroke="#CC0000" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="508" y="196" font-size="10.5" fill="#CC0000">any stage fails</text>
  <rect x="360" y="562" width="300" height="44" rx="6" fill="#fdecec" stroke="#CC0000" stroke-width="1.5"/>
  <text x="510" y="580" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#CC0000">FAIL &#8594; dead-letter + audit</text>
  <text x="510" y="596" font-size="10.5" text-anchor="middle" fill="#CC0000">(NEVER egress)</text>
</svg>
