# Admin UI for a single UTLXe instance.
#
# The engine runs in the SAME replica (Azure Container Apps shares one network namespace
# across a container app's containers), so these proxies address it over loopback.
#
# 127.0.0.1, not localhost: the engine binds host="0.0.0.0", which is the IPv4 wildcard and
# does not accept IPv6 connections. In a dual-stack container `localhost` resolves to both
# 127.0.0.1 and ::1, and nginx resolves upstream names at config-parse time — so `localhost`
# can send requests to ::1 and get connection refused from a healthy engine.
server {
    listen ${UI_PORT};
    server_name _;

    # Serve static UI files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to UTLXe admin port (same pod)
    location /admin/ {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
    }
}
