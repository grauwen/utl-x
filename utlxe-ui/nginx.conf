# Admin UI for a single UTLXe instance.
#
# The engine runs in the SAME replica (Azure Container Apps shares one network namespace
# across a container app's containers), so these proxies address it over loopback.
#
# 127.0.0.1, not localhost: the engine binds host="0.0.0.0", which is the IPv4 wildcard and
# does not accept IPv6 connections. In a dual-stack container `localhost` resolves to both
# 127.0.0.1 and ::1, and nginx resolves upstream names at config-parse time — so `localhost`
# can send requests to ::1 and get connection refused from a healthy engine.
server {
    listen ${UI_PORT};
    server_name _;

    # Serve static UI files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to UTLXe admin port (same pod)
    location /admin/ {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_set_header Host $host;
    }

    # ── EF24: the published data path ──
    #
    # The engine's data plane on ${DATA_PORT} is NOT published as an ingress; only this one
    # path reaches it, and only with a credential. Everything else on that port -- /api/load,
    # DELETE /api/transform/{id} (which unloads), /api/transformations (which lists) -- stays
    # unreachable from outside the replica.
    #
    # An anchored regex, not a prefix. `location /api/transformations/` would also match
    # sibling paths and anything that survives path normalisation; this matches exactly one
    # shape, one id segment, ending in /run.
    #
    # The key is DELIBERATELY not the admin key. A message sender must not be able to deploy,
    # unload, or list transformations. Authentication lives here rather than in the engine
    # because it is a gateway concern -- a transformation engine should transform.
    location ~ ^/api/transformations/[A-Za-z0-9._-]+/run$ {
        # An unset key must mean CLOSED, never open. envsubst renders ${DATA_PLANE_KEY} as an
        # empty string when the variable is unset, and `$http_x_api_key != ""` is FALSE for a
        # request that sends no header at all -- so without this first check an unconfigured
        # deployment would publish an unauthenticated remote execution path. 503, because the
        # route genuinely is not available rather than the caller being unauthorised.
        set $dp_key "${DATA_PLANE_KEY}";
        if ($dp_key = "") { return 503; }
        if ($http_x_api_key != $dp_key) { return 401; }

        proxy_pass http://127.0.0.1:${DATA_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Do not pass the credential downstream: it has no meaning to the engine and would
        # otherwise appear in its request logs.
        proxy_set_header X-Api-Key "";

        # Match MAX_REQUEST_BODY_BYTES in HttpTransport, so an oversized body is refused at the
        # edge instead of crossing the loopback first.
        client_max_body_size 10m;

        # A large XML transform can outlive the 60s default. The engine's own guards -- EF15
        # heap backpressure and per-transformation maxConcurrent -- are the real limits.
        proxy_read_timeout 120s;
    }
}
