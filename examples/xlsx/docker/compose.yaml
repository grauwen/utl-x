name: utlx-xlsx-test

services:
  engine:
    build:
      context: ../../..
      dockerfile: examples/xlsx/docker/Dockerfile
    init: true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - scratch:/work
    networks: [test]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      engine:
        condition: service_healthy
    ports: ["127.0.0.1:18090:8080"]
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Docker publishes ports through a non-internal gateway network.
    # The engine remains connected only to the internal test network.
    networks: [test, access]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scratch:

networks:
  test:
    internal: true
  access: {}
