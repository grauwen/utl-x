worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One server-wide counter enforces two active requests across all transformations.
    limit_conn_zone $server_name zone=imports:1m;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name utlx-xlsx-test;
        limit_conn imports 2;
        client_max_body_size 128m;
        client_body_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location = /api/health {
            limit_except GET { deny all; }
            proxy_pass http://engine:8080;
        }
        location = /api/load {
            limit_except POST { deny all; }
            proxy_pass http://engine:8080;
        }
        location ~ ^/api/transformations/[A-Za-z0-9_-]+/run$ {
            limit_except POST { deny all; }
            proxy_pass http://engine:8080;
        }
        location / {
            return 404;
        }
    }
}
