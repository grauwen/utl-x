name: tools_list
description: Test MCP server tools/list endpoint returns the registered tool set
tags:
  - protocol
  - tools
  - list

# Updated 2026-11-14. This fixture asserted 6 tools and the exact `required` array of each; the
# registry has grown to 12 (src/tools/index.ts), so it failed with "List length mismatch -
# expected 6, got 12" while the server was behaving correctly.
#
# It now asserts the tool NAMES, in registry order, and leaves each description and inputSchema
# as a placeholder. Naming the tools is the contract worth pinning -- a renamed or dropped tool
# breaks every client. The per-tool `required` arrays are not: they were the part that drifted,
# and they are covered by the per-tool call tests elsewhere in this suite.
#
# Adding a tool will still fail this fixture, which is deliberate: the public tool list should
# change consciously, not silently.
sequence:
  - description: "Request list of available tools"
    request:
      jsonrpc: "2.0"
      id: 2
      method: "tools/list"
      params: {}
    expect:
      jsonrpc: "2.0"
      id: 2
      result:
        tools:
          # Tool 1: parse input schemas
          - name: "get_input_schema"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 2: stdlib function registry
          - name: "get_stdlib_functions"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 3: operator registry
          - name: "get_operators"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 4: USDL directive registry
          - name: "get_usdl_directives"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 5: validate UTLX source
          - name: "validate_utlx"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 6: infer the output schema
          - name: "infer_output_schema"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 7: execute a transformation
          - name: "execute_transformation"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 8: search conformance examples
          - name: "get_examples"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 9: generate UTLX from natural language
          - name: "generate_utlx_from_prompt"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 10: LLM provider status
          - name: "check_llm_status"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 11: semantic gloss for an input (IF10 v2)
          - name: "describe_input"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
          # Tool 12: LLM gap refinement for MC coverage (IF11)
          - name: "refine_coverage"
            description: "{{STRING}}"
            inputSchema:
              type: "object"
              properties: "{{ANY}}"
