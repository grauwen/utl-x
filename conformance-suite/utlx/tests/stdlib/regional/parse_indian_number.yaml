name: "parse_indian_number"
category: "stdlib/regional"
description: "Test parseIndianNumber - Indian lakh/crore format (comma grouping, period decimal)"
tags: ["stdlib", "regional", "numbers", "parsing", "indian", "lakh", "crore"]

input:
  format: json
  data: |
    {}

transformation: |
  %utlx 1.0
  input json
  output json
  ---
  {
    lakh: parseIndianNumber("12,34,567.89"),
    crore: parseIndianNumber("1,23,45,678.90"),
    one_lakh: parseIndianNumber("1,00,000"),
    no_thousands: parseIndianNumber("1234.56"),
    negative: parseIndianNumber("-12,34,567.89")
  }

expected:
  format: json
  data:
    lakh: 1234567.89
    crore: 12345678.90
    one_lakh: 100000
    no_thousands: 1234.56
    negative: -1234567.89

performance_limits:
  max_duration_ms: 300
  max_memory_mb: 15

metadata:
  author: "UTL-X Conformance"
  source: "B33-indian-lakh-crore-variant-2026-10-16"
  complexity: "basic"
  notes:
    - "Indian format: comma thousands (irregular lakh/crore positions), period decimal"
    - "Parsing strips commas regardless of grouping position"
