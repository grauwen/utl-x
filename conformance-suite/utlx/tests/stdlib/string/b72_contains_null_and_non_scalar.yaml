name: "b72_contains_null_and_non_scalar"
category: "stdlib/string"
description: "B72: contains() with a null search value finds nothing (it used to search for \"\" and return true); a list or object as the search value in text is an error"
tags: ["string", "contains", "null", "B72"]

input:
  format: json
  data: |
    {"warehouses": [{"id": "W1", "state": "TX"}, {"id": "W2", "state": "CA"}, {"id": "W3"}, {"id": "W4", "state": null}], "code": 12345}

transformation: |
  %utlx 1.0
  input json
  output json
  ---
  {
    // The pattern that made B72 matter: W3 has no state, W4 a null one.
    southwest: $input.warehouses |> map(w => { id: w.id, southwest: contains("TX,OK,NM,AZ", w.state) }),
    nullInText: contains("abc", null),
    textInNull: contains(null, "a"),
    nullKey: contains(({"a": 1}), null),
    // Unchanged behaviour, pinned so a change is deliberate:
    emptyStringStillFound: contains("abc", ""),
    numbersAsText: contains($input.code, "23"),
    arraysStrict: contains([1, 2, 3], "2"),
    arrayHoldsNull: contains(["a", null], null)
  }

expected:
  format: json
  data: |
    {
      "southwest": [
        {"id": "W1", "southwest": true},
        {"id": "W2", "southwest": false},
        {"id": "W3", "southwest": false},
        {"id": "W4", "southwest": false}
      ],
      "nullInText": false,
      "textInNull": false,
      "nullKey": false,
      "emptyStringStillFound": true,
      "numbersAsText": true,
      "arraysStrict": false,
      "arrayHoldsNull": true
    }

variants:
  - name: "list_as_search_value_is_an_error"
    input:
      format: json
      data: |
        {"text": "abc"}
    transformation: |
      %utlx 1.0
      input json
      output json
      ---
      contains($input.text, [1])
    error_expected:
      type: "runtime_error"
      message_pattern: ".*second argument must be a single value.*"

metadata:
  author: "UTL-X Team"
  created: "2026-11-25"
  references: ["docs/bugs-fixed/B72-contains-searched-for-empty-text-when-given-null.md"]
