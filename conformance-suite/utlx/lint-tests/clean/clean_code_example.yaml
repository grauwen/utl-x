name: "clean_code_no_warnings"
category: "clean"
description: "Test that clean, well-written code produces no lint warnings"
tags: ["lint", "clean", "best-practices"]

# The semicolons after the two top-level `let` bindings were removed on 2026-11-14: they do not
# parse, so `utlx lint` refused the file with "Cannot lint: File has syntax errors" and this
# fixture tested a parse failure instead of linting. That rejection is a real defect -- F02
# documents `let x = 10; let y = 20; {...}` as valid -- tracked as B61. Restore the semicolons
# once B61 is fixed, so this fixture covers both forms.
script: |
  %utlx 1.0
  input json
  output json
  ---
  let customerName = $input.name
  let customerEmail = $input.email
  {
    name: customerName,
    email: customerEmail,
    timestamp: now()
  }

lint_expected:
  should_pass: true
  exit_code: 0
  errors: []
  warnings: []  # No warnings for clean code

metadata:
  author: "UTL-X Team"
  created: "2025-11-01"
