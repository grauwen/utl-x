name: "clean_code_no_warnings"
category: "clean"
description: "Test that clean, well-written code produces no lint warnings"
tags: ["lint", "clean", "best-practices"]

# The semicolons here were briefly removed on 2026-11-14 because they did not parse: `utlx lint`
# refused the file with "Cannot lint: File has syntax errors", so this fixture tested a parse
# failure rather than linting. That rejection was B61 -- F02 documents `let x = 10; let y = 20;`
# as valid and only the block half had been implemented. B61 is fixed, so the semicolon form is
# restored and this fixture now exercises both the separator and the linter.
script: |
  %utlx 1.0
  input json
  output json
  ---
  let customerName = $input.name;
  let customerEmail = $input.email;
  {
    name: customerName,
    email: customerEmail,
    timestamp: now()
  }

lint_expected:
  should_pass: true
  exit_code: 0
  errors: []
  warnings: []  # No warnings for clean code

metadata:
  author: "UTL-X Team"
  created: "2025-11-01"
