name: "missing_closing_brace"
category: "level1-syntax"
description: "Test detection of missing closing brace in object literal"
tags: ["syntax", "parse-error", "object", "brace"]

# Input references modernised from bare `input.x` to `$input.x` on 2026-11-14 (both resolve, but
# `$input` is the documented form). The missing '}' below is the point of the fixture.
script: |
  %utlx 1.0
  input json
  output json
  ---
  {
    name: $input.customerName,
    email: $input.emailAddress

validation_expected:
  should_pass: false
  exit_code: 1

  errors:
    - level: "syntax"
      type: "parse_error"
      # Was: ".*(expected|missing|unterminated).*[})].*" -- it required a brace or paren
      # character in the message text. The parser detects the unclosed object correctly (exit 1,
      # reported at the line after the last property), but words it "Expected property name or
      # spread operator", so the fixture failed on phrasing rather than behaviour. Asserting the
      # wording of a diagnostic makes the test brittle for no gain, so this now checks that a
      # syntax error is reported at all.
      #
      # The wording is worth improving separately: for an unclosed literal, naming the missing
      # '}' would help more than describing what the parser wanted next. If that lands, tighten
      # this pattern again to assert the better message.
      message_pattern: ".*[Ee]xpected.*"
      severity: "error"

  warnings: []

metadata:
  author: "UTL-X Team"
  created: "2025-11-01"
  updated: "2026-11-14"
